name: Notebook validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook validator
        run: python -m pip install 'nbformat>=5.10,<6'
      - name: Validate notebook structure without execution
        run: python scripts/validate_notebook.py
